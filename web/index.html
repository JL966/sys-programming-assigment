<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STC 板卡诊断</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:,"></head>
<body><header><b>STC · 板卡诊断</b><small>一次烧录 · 按项检查</small></header><main>
<section class="connection"><h1>检查你的学习板</h1><p>先烧录统一诊断HEX，再连接USB。</p><button id="connect">连接被测板</button> <button id="aux">连接辅助板</button> <button id="swap" disabled>交换两板</button><p id="ports">尚未连接</p></section>
<div id="notice" role="status"></div><section class="toolbar"><button class="primary" id="all">一键整轮</button><select id="test" aria-label="选择测试"></select><button id="single">单项测试</button><button id="cancel" disabled>取消整轮</button><button id="history">历史记录</button></section>
<section id="task" hidden><small id="count"></small><h2 id="title"></h2><ol id="steps"></ol><p id="live" role="status"></p><p id="timer" aria-live="off"></p><progress id="progress" max="1" value="0" hidden></progress><div id="choices"></div><button id="skip">跳过此项</button></section>
<section class="result-head"><div><small>本轮结果</small><h2 id="overall">未完成</h2><p id="counts"></p></div><div><button id="filter">只显示异常和未测试</button> <button id="html">导出HTML</button> <button id="json">导出JSON</button></div></section><section id="list"></section>
<footer>“正常”仅代表本轮检查通过。人工确认不等于自动检测。辅助板只用于红外与RS485。</footer></main><script type="module" src="js/diagnostic-app.js"></script></body></html>
