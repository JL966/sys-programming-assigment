<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>焊后无忧——STC学习板焊接故障诊断系统</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="workspace-bar">
    <div class="workspace-brand"><b>焊后无忧</b></div>
    <div class="workspace-meta" aria-label="诊断状态"><span id="connection-state"><i class="status-dot"></i>被测板待连接</span></div>
  </header>

  <main class="app-shell">
    <section id="learning-board" class="learning-board-panel panel" aria-labelledby="learning-board-title">
      <div class="learning-board-heading">
        <h2 id="learning-board-title">认识学习板</h2>
        <div class="learning-board-controls" role="tablist" aria-label="认识学习板视图">
          <button type="button" class="learning-tab is-active" data-learning-tab="board" role="tab" aria-controls="learning-panel-board" aria-selected="true" disabled>学习板</button>
          <button type="button" class="learning-tab" data-learning-tab="components" role="tab" aria-controls="learning-panel-components" aria-selected="false" disabled>元器件</button>
          <button type="button" class="learning-tab" data-learning-tab="extensions" role="tab" aria-controls="learning-panel-extensions" aria-selected="false" disabled>扩展模块</button>
          <button type="button" id="learning-fold" aria-expanded="false">展开</button>
        </div>
      </div>
      <div class="learning-panels is-collapsed">
        <div id="learning-panel-board" class="learning-stage" data-learning-panel="board" role="tabpanel" aria-label="学习板"></div>
        <div id="learning-panel-components" class="learning-components" data-learning-panel="components" role="tabpanel" aria-label="元器件" hidden></div>
        <div id="learning-panel-extensions" class="learning-extension-grid" data-learning-panel="extensions" role="tabpanel" aria-label="扩展模块" hidden></div>
      </div>
    </section>

    <section class="operation-panel panel" aria-label="诊断准备与操作">
      <section class="connection-zone" aria-labelledby="connection-title">
        <div class="panel-heading"><h2 id="connection-title">设备连接</h2></div>
        <div class="connection-actions">
          <button class="primary" id="connect">连接被测板</button>
          <button id="aux">连接辅助板</button>
          <button id="swap" disabled>交换两板</button>
        </div>
        <p id="ports" class="port-status">尚未连接</p>
      </section>

      <section class="diagnosis-zone action-bar" aria-label="诊断操作">
        <div class="panel-heading"><h2>开始诊断</h2></div>
        <div class="primary-actions">
          <button class="primary" id="all">一键整轮</button>
          <label class="test-picker"><span>单项复测</span><select id="test" aria-label="选择测试"></select></label>
          <button id="single">开始单项</button>
          <button id="cancel" disabled>取消整轮</button>
        </div>
        <div class="utility-actions">
          <button id="history">历史记录</button>
          <button id="resume">恢复未完成轮次</button>
        </div>
      </section>
    </section>

    <div id="notice" class="notice" role="status"></div>

    <section id="task" class="task-card panel" hidden aria-live="polite">
      <div class="task-heading"><div><p id="count" class="section-kicker"></p><h2 id="title"></h2></div></div>
      <div class="test-layout">
        <div class="operation">
          <ol id="steps"></ol>
          <p id="display-help" class="display-help"></p>
          <p id="live" role="status"></p>
          <p id="timer" aria-live="off"></p>
          <progress id="progress" max="1" value="0" hidden></progress>
          <div id="choices"></div>
          <button id="skip">跳过此项</button>
        </div>
        <aside id="device" hidden></aside>
      </div>
    </section>

    <section class="result-panel panel" aria-label="诊断结果">
      <div class="result-head">
        <div><h2 id="overall">未完成</h2><p id="counts"></p></div>
        <div class="result-actions"><button id="toggle-list" aria-expanded="true">收起清单</button><button id="filter">仅看异常和未测试</button><button id="html">导出 HTML</button><button id="json">导出 JSON</button></div>
      </div>
      <section id="list" aria-label="诊断结果列表"></section>
    </section>
  </main>
  <script type="module" src="js/diagnostic-app.js"></script>
</body>
</html>
